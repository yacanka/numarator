server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Missing build assets must stay 404 instead of returning the SPA document.
    location /assets/ {
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The frontend container owns these files, not the public gateway.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
